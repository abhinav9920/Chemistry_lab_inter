name: Assemble Chemical Equilibrium presentation

on:
  push:
    branches:
      - codex/chemical-equilibrium-presentation
    paths:
      - ".presentation-upload/ready"

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.head_commit.message == 'Stage Chemical Equilibrium presentation upload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble presentation PDF
        shell: bash
        run: |
          cat .presentation-upload/chunk-* > /tmp/chemical-equilibrium-presentation.b64
          base64 --decode /tmp/chemical-equilibrium-presentation.b64 > first-year/chemical-equilibrium/presentations/chemical-equilibrium-presentation-temp.pdf
          test "$(stat -c%s first-year/chemical-equilibrium/presentations/chemical-equilibrium-presentation-temp.pdf)" = "12566769"
          rm -rf .presentation-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble Chemical Equilibrium presentation PDF"
          git push
