<body style="margin:0">
<div id="atomic-smart-quiz">
  <style>
    #atomic-smart-quiz{--quiz-bg:var(--background,#f4f7fb);--quiz-card:var(--card,#fff);--quiz-text:var(--card-foreground,#172033);--quiz-muted:var(--muted-foreground,#667085);--quiz-border:var(--border,#d8dee9);--quiz-primary:var(--primary,#3157c8);--quiz-primary-text:var(--primary-foreground,#fff);--quiz-good:var(--green,#16835c);--quiz-bad:var(--red,#b33a3a);font-family:Arial,Helvetica,sans-serif;color:var(--quiz-text);background:var(--quiz-bg);padding:18px;min-height:650px}
    #atomic-smart-quiz *{box-sizing:border-box}#atomic-smart-quiz .quiz-shell{max-width:900px;margin:auto}#atomic-smart-quiz .quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}#atomic-smart-quiz .quiz-back{color:var(--quiz-primary);text-decoration:none;font-weight:700}#atomic-smart-quiz .quiz-source{color:var(--quiz-muted);font-size:13px}
    #atomic-smart-quiz .quiz-hero{text-align:center;margin:22px auto 26px;max-width:720px}#atomic-smart-quiz .quiz-hero h1{margin:0 0 8px;font-size:clamp(30px,5vw,46px)}#atomic-smart-quiz .quiz-hero p{margin:0;color:var(--quiz-muted);line-height:1.55}
    #atomic-smart-quiz .level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}#atomic-smart-quiz .level-card{display:flex;flex-direction:column;text-align:left;min-height:235px;padding:22px;border:1px solid var(--quiz-border);border-radius:18px;background:var(--quiz-card);color:var(--quiz-text);cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}#atomic-smart-quiz .level-card:hover{transform:translateY(-3px);border-color:var(--quiz-primary);box-shadow:0 10px 25px color-mix(in srgb,var(--quiz-text) 10%,transparent)}#atomic-smart-quiz .level-icon{font-size:38px;margin-bottom:13px}#atomic-smart-quiz .level-card strong{font-size:22px;margin-bottom:8px}#atomic-smart-quiz .level-card span{color:var(--quiz-muted);line-height:1.5}#atomic-smart-quiz .level-start{margin-top:auto;padding-top:17px;color:var(--quiz-primary)!important;font-weight:700}
    #atomic-smart-quiz .quiz-card{background:var(--quiz-card);border:1px solid var(--quiz-border);border-radius:20px;padding:clamp(20px,4vw,34px);box-shadow:0 8px 28px color-mix(in srgb,var(--quiz-text) 8%,transparent)}#atomic-smart-quiz .question-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}#atomic-smart-quiz .level-badge{display:inline-block;background:color-mix(in srgb,var(--quiz-primary) 12%,var(--quiz-card));color:var(--quiz-text);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700}#atomic-smart-quiz .quit-btn{border:0;background:transparent;color:var(--quiz-muted);font-weight:700;cursor:pointer;padding:7px}
    #atomic-smart-quiz .question-text{font-size:clamp(21px,3vw,28px);line-height:1.4;margin:0 0 22px}#atomic-smart-quiz .options{display:grid;gap:11px}#atomic-smart-quiz .option{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 16px;border:1px solid var(--quiz-border);border-radius:13px;background:var(--quiz-card);color:var(--quiz-text);text-align:left;font-size:16px;line-height:1.4;cursor:pointer}#atomic-smart-quiz .option:hover:not(:disabled){border-color:var(--quiz-primary);background:color-mix(in srgb,var(--quiz-primary) 6%,var(--quiz-card))}#atomic-smart-quiz .option.selected{border:2px solid var(--quiz-primary);padding:13px 15px}#atomic-smart-quiz .option.correct{border-color:var(--quiz-good);background:color-mix(in srgb,var(--quiz-good) 12%,var(--quiz-card))}#atomic-smart-quiz .option.wrong{border-color:var(--quiz-bad);background:color-mix(in srgb,var(--quiz-bad) 10%,var(--quiz-card))}#atomic-smart-quiz .option-letter{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--quiz-text) 7%,var(--quiz-card));font-weight:700;font-size:13px}
    #atomic-smart-quiz .quiz-message{min-height:24px;margin:12px 0 0;color:var(--quiz-bad);font-size:14px}#atomic-smart-quiz .answer-box{display:none;margin-top:19px;padding:16px 18px;border-left:4px solid var(--quiz-good);border-radius:10px;background:color-mix(in srgb,var(--quiz-good) 9%,var(--quiz-card));line-height:1.5}#atomic-smart-quiz .answer-box.show{display:block}#atomic-smart-quiz .answer-box strong{display:block;margin-bottom:5px}#atomic-smart-quiz .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}#atomic-smart-quiz .action-btn{border:1px solid var(--quiz-border);border-radius:11px;padding:11px 18px;background:var(--quiz-primary);color:var(--quiz-primary-text);font-weight:700;cursor:pointer}#atomic-smart-quiz .action-btn:disabled{opacity:.48;cursor:not-allowed}#atomic-smart-quiz .next-btn{display:none}#atomic-smart-quiz .next-btn.show{display:inline-block}
    #atomic-smart-quiz .result{text-align:center}#atomic-smart-quiz .result-icon{font-size:56px}#atomic-smart-quiz .result h2{font-size:32px;margin:8px 0}#atomic-smart-quiz .score{font-size:50px;font-weight:700;color:var(--quiz-primary);margin:18px 0 5px}#atomic-smart-quiz .result p{color:var(--quiz-muted);line-height:1.5}#atomic-smart-quiz .result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}#atomic-smart-quiz .secondary{background:var(--quiz-card);color:var(--quiz-text)}#atomic-smart-quiz .hidden{display:none!important}
    @media(max-width:720px){#atomic-smart-quiz{padding:12px}#atomic-smart-quiz .level-grid{grid-template-columns:1fr}#atomic-smart-quiz .level-card{min-height:185px}#atomic-smart-quiz .quiz-top{align-items:flex-start;flex-direction:column}#atomic-smart-quiz .quiz-card{padding:20px}#atomic-smart-quiz .actions{justify-content:stretch}#atomic-smart-quiz .action-btn{width:100%}}
  </style>
  <div class="quiz-shell">
    <div class="quiz-top"><a class="quiz-back" href="../">← Atomic Structure</a><span class="quiz-source">Basic &amp; Intermediate: notes • Advanced: EAPCET resources</span></div>
    <section id="level-screen">
      <div class="quiz-hero"><h1>🧠 Atomic Structure Smart Quiz</h1><p>Select a difficulty level. Questions appear one at a time, and the correct answer with an explanation is revealed after every response.</p></div>
      <div class="level-grid">
        <button class="level-card" data-level="basic"><span class="level-icon">🌱</span><strong>Basic</strong><span>Definitions, important facts and direct recall from the notes.</span><span class="level-start">Begin quiz →</span></button>
        <button class="level-card" data-level="intermediate"><span class="level-icon">⚗️</span><strong>Intermediate</strong><span>Applications, comparisons and familiar numerical problems.</span><span class="level-start">Begin quiz →</span></button>
        <button class="level-card" data-level="advanced"><span class="level-icon">🚀</span><strong>Advanced</strong><span>30 EAPCET questions from Practice Problems and Previous-Year Questions.</span><span class="level-start">Begin quiz →</span></button>
      </div>
    </section>
    <section id="question-screen" class="hidden">
      <div class="quiz-card">
        <div class="question-meta"><span class="level-badge" id="active-level"></span><button class="quit-btn" id="quit" type="button">Change level</button></div>
        <h2 class="question-text" id="question-text"></h2><div class="options" id="options"></div><div class="quiz-message" id="message" aria-live="polite"></div>
        <div class="answer-box" id="answer-box" aria-live="polite"><strong id="answer-heading"></strong><span id="explanation"></span></div>
        <div class="actions"><button class="action-btn" id="submit" type="button">Submit answer</button><button class="action-btn next-btn" id="next" type="button">Next question →</button></div>
      </div>
    </section>
    <section id="result-screen" class="hidden"><div class="quiz-card result"><div class="result-icon" id="result-icon">🏆</div><h2 id="result-title">Quiz complete</h2><div class="score" id="score"></div><p id="result-message"></p><div class="result-actions"><button class="action-btn" id="retry" type="button">Try this level again</button><button class="action-btn secondary" id="levels" type="button">Choose another level</button></div></div></section>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('atomic-smart-quiz');
    const questions={
      basic:[
        {id:'b01',q:'According to Rutherford’s nuclear model, where is nearly all the mass of an atom concentrated?',o:['In the nucleus','In the electron orbits','Throughout the empty space','Only in the outermost shell'],a:'In the nucleus',e:'The notes state that nearly all the mass of an atom is concentrated in its small, dense nucleus.'},
        {id:'b02',q:'What occupies most of the volume of an atom?',o:['Empty space','The nucleus','Protons','Neutrons'],a:'Empty space',e:'Rutherford’s model states that the nucleus occupies a very small volume and most of the atom is empty space.'},
        {id:'b03',q:'The atomic number Z of an element is equal to its number of:',o:['Protons','Neutrons','Protons plus neutrons','Orbitals'],a:'Protons',e:'Atomic number is defined in the notes as the number of protons present in the nucleus.'},
        {id:'b04',q:'Which expression gives the mass number A?',o:['Protons + neutrons','Protons - neutrons','Electrons + neutrons','Protons + electrons'],a:'Protons + neutrons',e:'Mass number is the total number of protons and neutrons: A = Z + N.'},
        {id:'b05',q:'How is a positive ion formed?',o:['By losing electrons','By gaining electrons','By gaining neutrons','By losing protons'],a:'By losing electrons',e:'The notes identify positive ions as cations formed when electrons are lost.'},
        {id:'b06',q:'Isotopes of an element have the same atomic number but different:',o:['Mass numbers','Numbers of protons','Chemical identity','Atomic symbols'],a:'Mass numbers',e:'Isotopes are atoms of the same element with the same atomic number and different mass numbers.'},
        {id:'b07',q:'Isobars have the same:',o:['Mass number','Atomic number','Number of protons','Chemical properties'],a:'Mass number',e:'Isobars are atoms of different elements having the same mass number but different atomic numbers.'},
        {id:'b08',q:'Electromagnetic radiation can travel through:',o:['Vacuum','Only solids','Only gases','Only a material medium'],a:'Vacuum',e:'The notes state that electromagnetic radiation does not require a material medium and can travel through vacuum.'},
        {id:'b09',q:'Which equation relates the energy of radiation to its frequency?',o:['E = hν','c = νλ','λ = h/p','A = Z + N'],a:'E = hν',e:'Planck’s equation in the notes is E = hν.'},
        {id:'b10',q:'Which equation relates the speed of light, frequency and wavelength?',o:['c = νλ','E = hν','λ = h/mv','mvr = nh/2π'],a:'c = νλ',e:'The notes give the frequency-wavelength relation as c = νλ.'},
        {id:'b11',q:'In Bohr’s model, permitted circular electron orbits are called:',o:['Stationary orbits','Matter waves','Subshells','Line spectra'],a:'Stationary orbits',e:'Bohr proposed that electrons revolve only in certain permitted circular orbits called stationary orbits.'},
        {id:'b12',q:'What is the appearance of an absorption spectrum?',o:['Dark lines on a bright background','Bright lines on a dark background','A continuous dark band','Bright lines on a bright background'],a:'Dark lines on a bright background',e:'Absorbed wavelengths are missing, so an absorption spectrum shows dark lines on a bright background.'},
        {id:'b13',q:'What is the appearance of an emission spectrum?',o:['Bright lines on a dark background','Dark lines on a bright background','Only a continuous spectrum','Dark lines on a dark background'],a:'Bright lines on a dark background',e:'Specific emitted wavelengths appear as bright lines on a dark background.'},
        {id:'b14',q:'Which equation gives the de Broglie wavelength?',o:['λ = h/p','E = hν','c = νλ','ΔxΔp = 0'],a:'λ = h/p',e:'The de Broglie relation given in the notes is λ = h/p, or λ = h/mv.'},
        {id:'b15',q:'Heisenberg’s principle says that which two quantities cannot both be determined exactly at the same time?',o:['Position and momentum','Mass and charge','Frequency and wavelength','Atomic number and mass number'],a:'Position and momentum',e:'It is impossible to determine simultaneously the exact position and exact momentum of a microscopic particle.'},
        {id:'b16',q:'Photoelectric emission occurs only when the incident frequency is:',o:['At least the threshold frequency','Below the threshold frequency','Always zero','Independent of threshold frequency'],a:'At least the threshold frequency',e:'The condition in the notes is ν ≥ ν₀.'},
        {id:'b17',q:'The principal quantum number n specifies the:',o:['Main energy level or shell','Shape of an orbital','Orientation of an orbital','Direction of spin only'],a:'Main energy level or shell',e:'The principal quantum number specifies the shell or main energy level occupied by an electron.'},
        {id:'b18',q:'The azimuthal quantum number l specifies the:',o:['Subshell and orbital shape','Main shell only','Electron spin','Number of neutrons'],a:'Subshell and orbital shape',e:'The notes state that l specifies the subshell and shape of the orbital.'},
        {id:'b19',q:'The magnetic quantum number mₗ specifies the:',o:['Orientation of an orbital','Size of the nucleus','Direction of electron spin','Mass of an electron'],a:'Orientation of an orbital',e:'The magnetic quantum number determines the orientation of an orbital in space.'},
        {id:'b20',q:'What are the possible values of the spin quantum number mₛ?',o:['+½ and -½','0 and 1','-1, 0 and +1','Any integer'],a:'+½ and -½',e:'An electron can have one of two spin values: mₛ = +½ or -½.'}
      ],
      intermediate:[
        {id:'i01',q:'How many protons, neutrons and electrons are present in neutral ²³₁₁Na?',o:['11, 12, 11','11, 11, 12','12, 11, 11','23, 11, 12'],a:'11, 12, 11',e:'Protons = Z = 11, neutrons = A - Z = 12, and a neutral atom has 11 electrons.'},
        {id:'i02',q:'How many electrons are present in ³⁵₁₇Cl⁻?',o:['18','17','16','35'],a:'18',e:'Neutral chlorine has 17 electrons; the -1 charge means it has gained one electron, giving 18.'},
        {id:'i03',q:'How many electrons are present in ⁴⁰₂₀Ca²⁺?',o:['18','20','22','40'],a:'18',e:'A 2+ ion has lost two electrons, so Ca²⁺ has 20 - 2 = 18 electrons.'},
        {id:'i04',q:'How many neutrons are present in ¹⁹₉F⁻?',o:['10','9','19','8'],a:'10',e:'Neutrons are unaffected by ionic charge: N = A - Z = 19 - 9 = 10.'},
        {id:'i05',q:'How many neutrons are present in ³⁷₁₇Cl?',o:['20','17','18','37'],a:'20',e:'N = A - Z = 37 - 17 = 20.'},
        {id:'i06',q:'Why are ⁴⁰₁₈Ar and ⁴⁰₂₀Ca classified as isobars?',o:['They have the same mass number but different atomic numbers','They have the same atomic number but different mass numbers','They have the same number of protons','They are the same element'],a:'They have the same mass number but different atomic numbers',e:'Both have A = 40, but their atomic numbers are 18 and 20.'},
        {id:'i07',q:'What is the frequency of radiation with wavelength 500 nm?',o:['6.0 × 10¹⁴ s⁻¹','3.98 × 10⁻¹⁹ s⁻¹','1.5 × 10² s⁻¹','5.0 × 10⁻⁷ s⁻¹'],a:'6.0 × 10¹⁴ s⁻¹',e:'Using ν = c/λ with 500 nm = 500 × 10⁻⁹ m gives 6.0 × 10¹⁴ s⁻¹, as solved in the notes.'},
        {id:'i08',q:'What is the energy of radiation with frequency 6.0 × 10¹⁴ s⁻¹?',o:['3.98 × 10⁻¹⁹ J','6.0 × 10¹⁴ J','500 J','1.10 × 10⁻⁷ J'],a:'3.98 × 10⁻¹⁹ J',e:'E = hν = (6.626 × 10⁻³⁴)(6.0 × 10¹⁴) = 3.98 × 10⁻¹⁹ J.'},
        {id:'i09',q:'If wavelength decreases, what happens to the energy of electromagnetic radiation?',o:['Energy increases','Energy decreases','Energy remains constant','Energy becomes zero'],a:'Energy increases',e:'Because E = hc/λ, energy is inversely proportional to wavelength.'},
        {id:'i10',q:'During absorption, an electron moves:',o:['From a lower to a higher energy level','From a higher to a lower energy level','Without changing energy','Out of the nucleus'],a:'From a lower to a higher energy level',e:'Absorption supplies energy and moves an electron to a higher energy level.'},
        {id:'i11',q:'According to de Broglie’s relation, a faster particle of the same mass has:',o:['A shorter wavelength','A longer wavelength','The same wavelength','No wave nature'],a:'A shorter wavelength',e:'λ = h/mv, so increasing velocity increases momentum and decreases wavelength.'},
        {id:'i12',q:'An electron has n = 4 and l = 2. In which subshell is it present?',o:['4d','4p','4f','3d'],a:'4d',e:'n = 4 gives the fourth shell, and l = 2 represents a d subshell.'},
        {id:'i13',q:'How many orbitals are present in a p subshell?',o:['3','1','5','7'],a:'3',e:'For p, l = 1 and the number of orbitals is 2l + 1 = 3.'},
        {id:'i14',q:'How many orbitals are present in a d subshell?',o:['5','3','7','2'],a:'5',e:'For d, l = 2 and 2l + 1 = 5 orbitals.'},
        {id:'i15',q:'What is the maximum number of electrons in the M shell (n = 3)?',o:['18','8','32','6'],a:'18',e:'Maximum electrons in a shell = 2n² = 2(3²) = 18.'},
        {id:'i16',q:'Which hydrogen spectral series ends at n = 2 and lies in the visible region?',o:['Balmer','Lyman','Paschen','Pfund'],a:'Balmer',e:'The Balmer series consists of transitions ending at n = 2 and occurs in the visible region.'},
        {id:'i17',q:'From Lyman to Pfund, wavelength increases. What happens to frequency and energy?',o:['Both decrease','Both increase','Frequency increases but energy decreases','They remain constant'],a:'Both decrease',e:'The notes state that wavelength increases from Lyman to Pfund while frequency and energy decrease.'},
        {id:'i18',q:'According to the Aufbau order, which orbital is filled first?',o:['4s before 3d','3d before 4s','4p before 4s','5s before 4p'],a:'4s before 3d',e:'The filling order in the notes includes 3p < 4s < 3d.'},
        {id:'i19',q:'Two electrons occupying the same orbital must have:',o:['Opposite spins','Parallel spins','The same four quantum numbers','Different principal quantum numbers'],a:'Opposite spins',e:'Pauli’s exclusion principle permits two electrons in one orbital only when their spins are opposite.'},
        {id:'i20',q:'How are the three electrons arranged in the 2p³ configuration?',o:['One in each p orbital with parallel spins','Two paired in one orbital and one in another','All three in one orbital','One in an s orbital and two in p orbitals'],a:'One in each p orbital with parallel spins',e:'Hund’s rule requires degenerate orbitals to be occupied singly with parallel spins before pairing.'}
      ],
      advanced:[
        {id:'a01',q:'A ⁵⁶Fe³⁺ ion has atomic number 26. How many protons, neutrons and electrons does it contain?',o:['26, 30, 23','26, 26, 23','30, 26, 29','26, 30, 29'],a:'26, 30, 23',e:'Protons = Z = 26, neutrons = A - Z = 56 - 26 = 30, and a 3+ ion has 26 - 3 = 23 electrons.'},
        {id:'a02',q:'An X²⁺ ion has mass number 24 and equal numbers of protons and neutrons. Identify its parent element and number of electrons.',o:['Magnesium, 10 electrons','Sodium, 9 electrons','Magnesium, 12 electrons','Carbon, 10 electrons'],a:'Magnesium, 10 electrons',e:'A = Z + N and N = Z, so 24 = 2Z and Z = 12. The element is Mg, and Mg²⁺ has 12 - 2 = 10 electrons.'},
        {id:'a03',q:'²³⁵₉₂U and ²³¹₉₀Th have the same neutron-proton excess, N - Z = 51. They are:',o:['Isodiaphers','Isotones','Isobars','Isotopes'],a:'Isodiaphers',e:'Species having the same value of N - Z are isodiaphers. Here both nuclei have a neutron-proton excess of 51.'},
        {id:'a04',q:'Arrange the isoelectronic species O²⁻, F⁻, Na⁺, Mg²⁺ and Al³⁺ in decreasing ionic radius.',o:['O²⁻ > F⁻ > Na⁺ > Mg²⁺ > Al³⁺','Al³⁺ > Mg²⁺ > Na⁺ > F⁻ > O²⁻','F⁻ > O²⁻ > Na⁺ > Mg²⁺ > Al³⁺','O²⁻ > Na⁺ > F⁻ > Al³⁺ > Mg²⁺'],a:'O²⁻ > F⁻ > Na⁺ > Mg²⁺ > Al³⁺',e:'All five species have 10 electrons. Within an isoelectronic series, increasing nuclear charge pulls the same electron cloud closer and decreases the radius.'},
        {id:'a05',q:'Which experiment revealed the small, dense atomic nucleus and showed that most of an atom is empty space?',o:['Rutherford alpha-particle scattering','Millikan oil-drop experiment','Thomson cathode-ray experiment','Chadwick neutron experiment'],a:'Rutherford alpha-particle scattering',e:'Most alpha particles passed through the foil, while a very small fraction underwent large deflections. This led to the nuclear model of the atom.'},
        {id:'a06',q:'What approximate charge-to-mass ratio of the electron was determined by J. J. Thomson?',o:['1.76 × 10¹¹ C kg⁻¹','9.11 × 10⁻³¹ C kg⁻¹','1.60 × 10⁻¹⁹ C kg⁻¹','6.02 × 10²³ C kg⁻¹'],a:'1.76 × 10¹¹ C kg⁻¹',e:'Thomson measured the magnitude of the electron charge-to-mass ratio as approximately 1.76 × 10¹¹ C kg⁻¹.'},
        {id:'a07',q:'Arrange radio waves, microwaves, visible light and X-rays in increasing energy per photon.',o:['Radio waves < microwaves < visible light < X-rays','X-rays < visible light < microwaves < radio waves','Visible light < radio waves < microwaves < X-rays','Microwaves < radio waves < X-rays < visible light'],a:'Radio waves < microwaves < visible light < X-rays',e:'Photon energy is E = hν. Frequency, and therefore energy, increases from radio waves through microwaves and visible light to X-rays.'},
        {id:'a08',q:'A 450 nm laser beam has what wavenumber and photon energy?',o:['2.22 × 10⁴ cm⁻¹ and 4.42 × 10⁻¹⁹ J','2.22 × 10⁶ cm⁻¹ and 4.42 × 10⁻²⁷ J','4.50 × 10⁴ cm⁻¹ and 2.22 × 10⁻¹⁹ J','2.22 × 10⁻⁴ cm⁻¹ and 4.42 × 10¹⁹ J'],a:'2.22 × 10⁴ cm⁻¹ and 4.42 × 10⁻¹⁹ J',e:'Using 1/λ with λ = 4.50 × 10⁻⁵ cm gives 2.22 × 10⁴ cm⁻¹. Using E = hc/λ gives 4.42 × 10⁻¹⁹ J.'},
        {id:'a09',q:'A metal has work function 2.4 eV. What is its threshold frequency, and will 600 nm light eject electrons?',o:['5.80 × 10¹⁴ Hz; no emission','5.80 × 10¹⁴ Hz; emission occurs','2.40 × 10¹⁴ Hz; no emission','7.50 × 10¹⁴ Hz; emission occurs'],a:'5.80 × 10¹⁴ Hz; no emission',e:'ν₀ = W₀/h = 5.80 × 10¹⁴ Hz. A 600 nm photon has only about 2.07 eV, less than the 2.4 eV work function, so it cannot eject an electron.'},
        {id:'a10',q:'A metal with threshold wavelength 310 nm is irradiated by 200 nm light. What are the maximum photoelectron kinetic energy and speed?',o:['2.2 eV and 8.80 × 10⁵ m s⁻¹','4.0 eV and 1.19 × 10⁶ m s⁻¹','6.2 eV and 1.48 × 10⁶ m s⁻¹','2.2 eV and 8.80 × 10³ m s⁻¹'],a:'2.2 eV and 8.80 × 10⁵ m s⁻¹',e:'The photon energy is 1240/200 = 6.2 eV and the work function is 1240/310 = 4.0 eV. Thus Kₘₐₓ = 2.2 eV and vₘₐₓ = √(2K/mₑ) = 8.80 × 10⁵ m s⁻¹.'},
        {id:'a11',q:'A 60 W sodium lamp emits 589 nm light. Approximately how many photons does it emit each second?',o:['1.8 × 10²⁰','1.8 × 10²³','3.6 × 10¹⁹','6.0 × 10²⁰'],a:'1.8 × 10²⁰',e:'Energy per photon is hc/λ ≈ 3.38 × 10⁻¹⁹ J. Dividing 60 J s⁻¹ by this energy gives about 1.8 × 10²⁰ photons s⁻¹.'},
        {id:'a12',q:'According to Bohr’s postulate, which expression gives the permitted angular momentum of an electron in the nth orbit?',o:['mvr = nh/2π','mvr = nh','mvr = n²h/2π','mvr = nh²/2π'],a:'mvr = nh/2π',e:'Bohr quantized orbital angular momentum in integral multiples of h/2π: mvr = nh/2π.'},
        {id:'a13',q:'Compare the radius of He⁺ in n = 2 with that of Li²⁺ in n = 3.',o:['105.8 pm and 158.7 pm; ratio 2 : 3','52.9 pm and 158.7 pm; ratio 1 : 3','105.8 pm and 105.8 pm; ratio 1 : 1','211.6 pm and 476.1 pm; ratio 4 : 9'],a:'105.8 pm and 158.7 pm; ratio 2 : 3',e:'For a hydrogen-like ion, rₙ = 52.9n²/Z pm. This gives 105.8 pm for He⁺ and 158.7 pm for Li²⁺, so the ratio is 2 : 3.'},
        {id:'a14',q:'How much energy is required to excite hydrogen from n = 2 to n = 4?',o:['2.55 eV','10.20 eV','12.75 eV','0.85 eV'],a:'2.55 eV',e:'E₂ = -13.6/4 = -3.4 eV and E₄ = -13.6/16 = -0.85 eV. Therefore ΔE = E₄ - E₂ = 2.55 eV.'},
        {id:'a15',q:'What is the energy of the electron in the second orbit of Li²⁺?',o:['-30.6 eV','-3.4 eV','-13.6 eV','-1.13 eV'],a:'-30.6 eV',e:'For a hydrogen-like ion, Eₙ = -13.6Z²/n² eV. With Z = 3 and n = 2, E = -13.6 × 9/4 = -30.6 eV.'},
        {id:'a16',q:'As n increases in hydrogen, what happens to the energy gap between consecutive Bohr orbits?',o:['It decreases','It increases','It remains constant','It first increases and then remains constant'],a:'It decreases',e:'Hydrogen energy levels vary as -1/n² and become progressively closer together as n increases.'},
        {id:'a17',q:'Using Rᴴ = 1.097 × 10⁷ m⁻¹, what is the wavelength and region of the second Balmer line, n = 4 → 2?',o:['486.2 nm, visible','656.3 nm, visible','121.6 nm, ultraviolet','1875 nm, infrared'],a:'486.2 nm, visible',e:'For n = 4 → 2, 1/λ = Rᴴ(1/2² - 1/4²) = 3Rᴴ/16. Hence λ ≈ 486.2 nm, in the visible region.'},
        {id:'a18',q:'What is the shortest wavelength of the Lyman series for He⁺?',o:['1/(4Rᴴ)','1/Rᴴ','4/Rᴴ','1/(2Rᴴ)'],a:'1/(4Rᴴ)',e:'At the Lyman limit, nᵢ = ∞ and n𝒻 = 1. For He⁺, Z = 2, so 1/λ = RᴴZ² = 4Rᴴ and λ = 1/(4Rᴴ).'},
        {id:'a19',q:'What is the magnitude of the orbital angular momentum of an electron in a 3p orbital?',o:['√2(h/2π)','√6(h/2π)','√3(h/2π)','0'],a:'√2(h/2π)',e:'For a p orbital, l = 1. Orbital angular momentum is √[l(l + 1)](h/2π) = √2(h/2π).'},
        {id:'a20',q:'Which hydrogen transition releases the highest-energy photon?',o:['n = 2 → 1','n = 3 → 2','n = 5 → 4','n = 6 → 5'],a:'n = 2 → 1',e:'Photon energy equals the difference between the two levels. Among these transitions, the n = 2 → 1 energy gap is the largest.'},
        {id:'a21',q:'What is the de Broglie wavelength of an electron accelerated through 150 V?',o:['100.2 pm','12.27 pm','150.0 pm','1.002 pm'],a:'100.2 pm',e:'Using λ ≈ 1.227/√V nm gives 1.227/√150 ≈ 0.1002 nm = 100.2 pm.'},
        {id:'a22',q:'A proton and an alpha particle have equal kinetic energies. What is λₚ : λᵅ?',o:['2 : 1','1 : 2','4 : 1','1 : 4'],a:'2 : 1',e:'At equal kinetic energy, λ is proportional to 1/√m. Since an alpha particle has about four times the proton mass, λₚ/λᵅ = √4 = 2.'},
        {id:'a23',q:'A 0.1 kg ball moves at 10 m s⁻¹. What is its approximate de Broglie wavelength?',o:['6.63 × 10⁻³⁴ m','6.63 × 10⁻³³ m','6.63 × 10⁻³² m','6.63 × 10⁻³⁵ m'],a:'6.63 × 10⁻³⁴ m',e:'Its momentum is mv = 1 kg m s⁻¹, so λ = h/p = 6.63 × 10⁻³⁴ m. The tiny value explains why wave behaviour is not evident macroscopically.'},
        {id:'a24',q:'The uncertainty in the velocity of a helium atom of mass 6.64 × 10⁻²⁷ kg is 1.0 m s⁻¹. What is the minimum uncertainty in position?',o:['7.94 × 10⁻⁹ m','7.94 × 10⁻⁷ m','5.30 × 10⁻²⁵ m','1.00 × 10⁻¹⁰ m'],a:'7.94 × 10⁻⁹ m',e:'From Δx·mΔv ≥ h/4π, Δx ≥ h/(4πmΔv) = 7.94 × 10⁻⁹ m.'},
        {id:'a25',q:'For an electron, Δx and Δv are numerically equal. What is the minimum value of Δv?',o:['7.61 × 10⁻³ m s⁻¹','5.30 × 10⁻²⁵ m s⁻¹','9.11 × 10⁻³¹ m s⁻¹','7.61 × 10³ m s⁻¹'],a:'7.61 × 10⁻³ m s⁻¹',e:'Setting Δx = Δv in mΔxΔv ≥ h/4π gives Δvₘᵢₙ = √(h/4πm). For an electron this is 7.61 × 10⁻³ m s⁻¹.'},
        {id:'a26',q:'Which set of quantum numbers is impossible for an electron?',o:['n = 2, l = 1, mₗ = 2, mₛ = -½','n = 3, l = 2, mₗ = -2, mₛ = +½','n = 4, l = 0, mₗ = 0, mₛ = +½','n = 3, l = 1, mₗ = 1, mₛ = -½'],a:'n = 2, l = 1, mₗ = 2, mₛ = -½',e:'For l = 1, mₗ may only be -1, 0 or +1. The value mₗ = 2 is therefore not allowed.'},
        {id:'a27',q:'How many electrons can occupy the subshell defined by n = 4 and l = 3?',o:['14','10','6','2'],a:'14',e:'l = 3 identifies the 4f subshell. It contains 2l + 1 = 7 orbitals, each holding two electrons, for a maximum of 14.'},
        {id:'a28',q:'How many radial, angular and total nodes are present in a 4d orbital?',o:['1 radial, 2 angular, 3 total','2 radial, 1 angular, 3 total','1 radial, 3 angular, 4 total','0 radial, 2 angular, 2 total'],a:'1 radial, 2 angular, 3 total',e:'For 4d, n = 4 and l = 2. Radial nodes = n - l - 1 = 1, angular nodes = l = 2, and total nodes = n - 1 = 3.'},
        {id:'a29',q:'Why is the ground-state configuration of chromium [Ar]3d⁵4s¹ rather than [Ar]3d⁴4s²?',o:['A half-filled 3d subshell gains exchange-energy and symmetry stability','The 4s orbital cannot hold two electrons','Pauli’s principle requires five 3d electrons','The 3d subshell fills completely before 4s'],a:'A half-filled 3d subshell gains exchange-energy and symmetry stability',e:'The 3d⁵ arrangement has more favourable exchange interactions and a more symmetrical half-filled charge distribution, making [Ar]3d⁵4s¹ more stable.'},
        {id:'a30',q:'Co²⁺ has configuration [Ar]3d⁷. How many unpaired electrons and what spin-only magnetic moment does it have?',o:['3 unpaired; 3.87 B.M.','2 unpaired; 2.83 B.M.','4 unpaired; 4.90 B.M.','5 unpaired; 5.92 B.M.'],a:'3 unpaired; 3.87 B.M.',e:'Hund’s rule gives three unpaired electrons in 3d⁷. The spin-only moment is √[N(N + 2)] = √15 = 3.87 B.M.'}
      ]
    };
    const $=selector=>root.querySelector(selector);const shuffle=array=>{const copy=[...array];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
    let level='',queue=[],index=0,score=0,selected='',answered=false,displayOptions=[];
    function show(screen){['#level-screen','#question-screen','#result-screen'].forEach(id=>$(id).classList.toggle('hidden',id!==screen))}
    function start(chosen){level=chosen;queue=shuffle(questions[level]);index=0;score=0;$('#active-level').textContent=level[0].toUpperCase()+level.slice(1)+' level';show('#question-screen');renderQuestion()}
    function renderQuestion(){const item=queue[index];selected='';answered=false;displayOptions=shuffle(item.o);$('#question-text').textContent=item.q;$('#options').innerHTML='';displayOptions.forEach((option,i)=>{const button=document.createElement('button');button.type='button';button.className='option';button.dataset.value=option;button.innerHTML='<span class="option-letter">'+String.fromCharCode(65+i)+'</span><span></span>';button.lastElementChild.textContent=option;button.addEventListener('click',()=>selectOption(button,option));$('#options').appendChild(button)});$('#message').textContent='';$('#answer-box').classList.remove('show');$('#submit').classList.remove('hidden');$('#submit').disabled=false;$('#next').classList.remove('show')}
    function selectOption(button,value){if(answered)return;selected=value;root.querySelectorAll('.option').forEach(option=>option.classList.remove('selected'));button.classList.add('selected');$('#message').textContent=''}
    function submit(){if(!selected){$('#message').textContent='Select an answer before submitting.';return}const item=queue[index];answered=true;const correct=selected===item.a;if(correct)score++;root.querySelectorAll('.option').forEach(button=>{button.disabled=true;if(button.dataset.value===item.a)button.classList.add('correct');else if(button.dataset.value===selected)button.classList.add('wrong')});$('#answer-heading').textContent=correct?'✓ Correct':'Correct answer: '+item.a;$('#explanation').textContent=item.e;$('#answer-box').classList.add('show');$('#submit').classList.add('hidden');$('#next').classList.add('show');$('#next').textContent=index===queue.length-1?'View result →':'Next question →'}
    function next(){index++;if(index>=queue.length){finish();return}renderQuestion()}
    function finish(){const percent=Math.round(score/queue.length*100);$('#score').textContent=score+' / '+queue.length;$('#result-icon').textContent=percent>=85?'🏆':percent>=60?'⭐':'🌱';$('#result-title').textContent=level[0].toUpperCase()+level.slice(1)+' quiz complete';$('#result-message').textContent=percent>=85?'Excellent work! You have a strong command of this level.':percent>=60?'Good progress. Review the explanations and try again to improve your score.':level==='advanced'?'Keep practising. Review the EAPCET resources and attempt this level again.':'Keep practising. Re-read the chapter notes and attempt this level again.';show('#result-screen')}
    root.querySelectorAll('.level-card').forEach(button=>button.addEventListener('click',()=>start(button.dataset.level)));$('#submit').addEventListener('click',submit);$('#next').addEventListener('click',next);$('#quit').addEventListener('click',()=>show('#level-screen'));$('#retry').addEventListener('click',()=>start(level));$('#levels').addEventListener('click',()=>show('#level-screen'));
  })();
  </script>
